  <title id="arch-title">open-workhorse - Phase 0 After</title>
  <desc id="arch-desc">Phase 0 target architecture after boundary freeze, where the control plane, coordinator, workers, and runtime kernel contracts are separated conceptually before implementation-heavy migrations begin.</desc>
